<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project Preference</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <h2>How do you want your project to be?</h2>

  <div class="toggle-container">
    <input type="checkbox" id="good" class="toggle">
    <label for="good" class="label">
      <div class="circle"></div>
    </label>
    <span>Good</span>
  </div>

  <div class="toggle-container">
    <input type="checkbox" id="average" class="toggle">
    <label for="average" class="label">
      <div class="circle"></div>
    </label>
    <span>Average</span>
  </div>

  <div class="toggle-container">
    <input type="checkbox" id="excellent" class="toggle">
    <label for="excellent" class="label">
      <div class="circle"></div>
    </label>
    <span>Excellent</span>
  </div>
</body>
<script src="script.js"></script>
</html>
